# 标准库回归与只读检查；索引构建只发生在临时副本。
stages:
  - test

variables:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

.ygg_base:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git >/dev/null

regression:
  extends: .ygg_base
  stage: test
  script:
    - python -S tests/run_tests.py

repository_check:
  extends: .ygg_base
  stage: test
  script:
    - python -S tests/check_repository.py
