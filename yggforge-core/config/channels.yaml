# =============================================================================
# Channel 预设词典（沟通入口 / Agent 来源）
# =============================================================================
# id 为规范名（写入 front matter 的 channel 字段）。
# aliases 用于 normalize（大小写不敏感）。
# category: chat | agent | ide | other
# 列表请用多行 `-`，便于无 PyYAML 时的最小解析器。
# =============================================================================

version: 1

channels:
