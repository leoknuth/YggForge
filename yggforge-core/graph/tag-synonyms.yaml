# Tag 同义词表（与 tag-graph 同属 graph/）
#
# key = 标准保留标签
# values = 遇到时归并到 key 的同义/近义词
#
# 用法：ygg remember --tags ... 与 ygg tag / associate 会读取本文件做归一化。

version: 1

# tag 标签规范语言：en=英文，zh=中文。影响 seed tag 提炼与新增 tag 的语言。
# 查询：ygg tag --language。缺省 en。详见 knowledge/rules/seed-tag-language.md。
language: en

