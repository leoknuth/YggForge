{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "YggForge role.yaml",
  "description": "角色配置契约。记忆空间由注册表固定解析，配置中的路径不能扩大运行权限。",
  "type": "object",
  "required": [
    "id",
    "name",
    "revision",
    "description",
    "entry",
    "identity",
    "skills",
    "shared_paths",
    "retrieval",
    "memory"
  ],
  "properties": {
    "id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$",
      "maxLength": 80
    },
    "name": {
      "type": "string",
      "minLength": 1
    },
    "revision": {
      "type": "integer",
      "minimum": 1
    },
    "description": {
      "type": "string",
      "minLength": 1
    },
    "tags": {
      "type": "array",
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1},
      "description": "角色发现标签，仅筛选候选，不授予共享或执行权限"
    },
    "entry": {
      "const": "AGENTS.md"
    },
    "identity": {
      "const": "IDENTITY.md"
    },
    "skills": {
      "type": "array",
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "default_skills": {
      "type": "array",
      "items": {"type": "string", "minLength": 1},
      "uniqueItems": true,
      "description": "默认必读首入口，必须引用已注册技能，不受可选检索skill_limit裁剪"
    },
    "skill_workflows": {
      "type": "object",
      "additionalProperties": {
        "type": "array",
        "items": {"type": "string", "minLength": 1},
        "uniqueItems": true
      },
      "description": "工作流ID到完整已注册技能列表，task.workflow选择且不按四项预算裁剪"
    },
    "shared_paths": {
      "type": "array",
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "retrieval": {
      "type": "object",
      "properties": {
        "shared_limit": {
          "type": "integer",
          "minimum": 0,
          "maximum": 50
        },
        "role_limit": {
          "type": "integer",
          "minimum": 0,
          "maximum": 50
        },
        "max_chars": {
          "type": "integer",
          "minimum": 512,
          "maximum": 200000,
          "description": "每路检索命中的正文预算；完整角色设定、技能和业务STATE不截断"
        },
        "skill_limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 20,
          "description": "可选自动命中技能上限；默认入口、完整工作流和显式skills不裁剪"
        }
      },
      "required": [
        "shared_limit",
        "role_limit",
        "max_chars"
      ],
      "additionalProperties": false
    },
    "memory": {
      "type": "object",
      "properties": {
        "summary": {
          "const": "memories/summary.md"
        }
      },
      "required": [
        "summary"
      ],
      "additionalProperties": false
    },
    "graph": {
      "type": "object",
      "description": "仅允许图查询权重与存储参数，不能改变角色图目录",
      "properties": {
        "default_hop": {
          "type": "integer",
          "minimum": 0
        },
        "entry_related_hops": {
          "type": "integer",
          "minimum": 0
        },
        "max_tag_nodes": {
          "type": "integer",
          "minimum": 1
        },
        "weight": {
          "type": "object"
        },
        "storage": {
          "type": "object"
        }
      },
      "additionalProperties": false
    },
    "context_files": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "type": "string"
      },
      "description": "可选的角色内补充设定，长期历史不全量放入启动上下文"
    },
    "case_template": {
      "type": "string",
      "pattern": "^templates/",
      "description": "本角色新命例工序模板；事实与报告只进records"
    },
    "records": {
      "type": "object",
      "description": "稳定业务ID映射到自身records目录和STATE.md；项目作用域project_id继续保留",
      "additionalProperties": {
        "type": "object",
        "required": ["path", "state"],
        "properties": {
          "path": {"type": "string", "pattern": "^records/", "minLength": 9},
          "state": {"const": "STATE.md"}
        },
        "additionalProperties": false
      }
    }
  },
  "additionalProperties": false
}
